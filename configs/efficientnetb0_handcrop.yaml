# EfficientNetB0 sobre los mismos recortes MediaPipe.
data:
  raw_dir: data/raw/asl_alphabet_train/asl_alphabet_train
  image_dir: data/processed/hand_crops/asl_alphabet_train
  crop_manifest: data/processed/hand_crops/asl_alphabet_train_manifest.csv
  no_hand_class: nothing
  split: {train: 0.70, val: 0.15, test: 0.15}
  seed: 42
  img_size: [128, 128]
  batch_size: 64

model:
  name: efficientnetb0
  weights: imagenet
  dropout: 0.3

train:
  epochs_head: 3
  epochs_finetune: 12
  lr_head: 0.001
  lr_finetune: 0.00005
  unfreeze_layers: 40
  mixed_precision: true
  monitor: val_accuracy
  early_stopping_patience: 4
  reduce_lr_patience: 2
