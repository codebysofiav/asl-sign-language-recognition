# Experimento A (referencia): MobileNetV2 con el aumento básico original, sobre una MUESTRA del dataset.
# Sirve de punto de comparación para B-E (mismos datos, misma semilla, mismas épocas).
data:
  raw_dir: data/raw/asl_alphabet_train/asl_alphabet_train
  split: {train: 0.70, val: 0.15, test: 0.15}
  seed: 42
  img_size: [128, 128]
  batch_size: 64
  train_per_class: 700     # 20.300 imágenes de entrenamiento (de 60.900)
  val_per_class: 100
  test_per_class: 100

model:
  name: mobilenetv2
  weights: imagenet
  dropout: 0.3

# (sin sección `augment`: se usa el aumento básico: rotación ±18°, zoom ±10 %, traslación ±5 %)

train:
  epochs_head: 3
  epochs_finetune: 9
  lr_head: 0.001
  lr_finetune: 0.00005
  unfreeze_layers: 30
  mixed_precision: true
  monitor: val_accuracy
  early_stopping_patience: 3
  reduce_lr_patience: 2
